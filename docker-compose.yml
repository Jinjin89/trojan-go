# Trojan-Go server built from this source tree.
#
# 1. edit deploy/config.json   (password and domain)
# 2. put cert.pem and key.pem into deploy/cert/
# 3. docker compose up -d --build

services:
  trojan-go:
    build: .
    image: trojan-go:local
    container_name: trojan-go
    restart: unless-stopped
    # host networking avoids the docker-proxy hop and NAT: lower latency, higher throughput
    network_mode: host
    volumes:
      - ./deploy/config.json:/etc/trojan-go/config.json:ro
      - ./deploy/cert:/cert:ro
    # every proxied connection uses at least two file descriptors; the docker
    # default soft limit of 1024 is far too low for a busy proxy
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    # keep the log from filling the disk
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
